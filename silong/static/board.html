<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silong: staff board</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="page board">
    <h1>Silong staff board</h1>
    <p id="connection" class="connection" role="status" aria-live="polite">Connecting to the hub…</p>
    <p id="empty" class="hint" hidden>No reports yet.</p>

    <section aria-labelledby="unclassified-heading">
      <h2 id="unclassified-heading">Not yet triaged <span id="unclassified-count"></span></h2>
      <p class="hint">These reports have no urgency assigned yet. Read each one; a failed report can be retried.</p>
      <ol id="unclassified" class="reports"></ol>
    </section>

    <section aria-labelledby="triaged-heading">
      <h2 id="triaged-heading">Triaged <span id="triaged-count"></span></h2>
      <p class="hint">Most urgent first. Urgency comes from fixed rules, with the reason shown on each card.</p>
      <ol id="triaged" class="reports"></ol>
    </section>

    <section aria-labelledby="resolved-heading">
      <details class="resolved-section">
        <summary><h2 id="resolved-heading">Resolved <span id="resolved-count"></span></h2></summary>
        <ol id="resolved" class="reports"></ol>
      </details>
    </section>
  </main>
  <script src="/static/board.js"></script>
</body>
</html>
